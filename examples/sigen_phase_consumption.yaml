# Sigenergy per-phase house consumption
# -------------------------------------
# House load on each phase = inverter AC output on that phase + grid power on that phase
#   (grid is + import / - export, so during export this subtracts what goes to the grid)
# Uses the native Sigen plant sensors (not the V x I sigen_inverter_phase_*_power templates).
#
# Install: put this file in /config/packages/ and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart HA.
#
# Resulting entities:
#   sensor.sigen_plant_consumed_power_phase_a / _b / _c          (kW, live)
#   sensor.sigen_plant_consumed_energy_phase_a / _b / _c         (kWh, ever-increasing - use in Energy dashboard)
#   sensor.sigen_plant_consumed_energy_phase_a_daily / _b / _c   (kWh, resets at midnight)
#   sensor.sigen_plant_grid_import_power_phase_a / _b / _c       (kW, grid import on that phase, else 0)
#   sensor.sigen_plant_grid_export_power_phase_a / _b / _c       (kW, grid export on that phase, else 0)
#   sensor.sigen_plant_grid_import_energy_phase_a / _b / _c      (kWh, ever-increasing)
#   sensor.sigen_plant_grid_export_energy_phase_a / _b / _c      (kWh, ever-increasing)
# The card shows the energy totals as "today" via recorder statistics, so no daily meters are needed for them.

template:
  - sensor:
      - name: "Sigen Plant Consumed Power Phase A"
        unique_id: sigen_plant_consumed_power_phase_a
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        # clamped at 0: a phase's house load can't be negative; brief negatives are meter timing skew
        state: >
          {{ [ states('sensor.sigen_plant_phase_a_active_power') | float(0)
             + states('sensor.sigen_plant_grid_phase_a_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_phase_a_active_power')
             and has_value('sensor.sigen_plant_grid_phase_a_active_power') }}

      - name: "Sigen Plant Consumed Power Phase B"
        unique_id: sigen_plant_consumed_power_phase_b
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ states('sensor.sigen_plant_phase_b_active_power') | float(0)
             + states('sensor.sigen_plant_grid_phase_b_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_phase_b_active_power')
             and has_value('sensor.sigen_plant_grid_phase_b_active_power') }}

      - name: "Sigen Plant Consumed Power Phase C"
        unique_id: sigen_plant_consumed_power_phase_c
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ states('sensor.sigen_plant_phase_c_active_power') | float(0)
             + states('sensor.sigen_plant_grid_phase_c_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_phase_c_active_power')
             and has_value('sensor.sigen_plant_grid_phase_c_active_power') }}

  # Grid power per phase split by direction (Sigen: + = import, - = export)
  - sensor:
      - name: "Sigen Plant Grid Import Power Phase A"
        unique_id: sigen_plant_grid_import_power_phase_a
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ states('sensor.sigen_plant_grid_phase_a_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_grid_phase_a_active_power') }}

      - name: "Sigen Plant Grid Export Power Phase A"
        unique_id: sigen_plant_grid_export_power_phase_a
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ 0 - states('sensor.sigen_plant_grid_phase_a_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_grid_phase_a_active_power') }}

      - name: "Sigen Plant Grid Import Power Phase B"
        unique_id: sigen_plant_grid_import_power_phase_b
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ states('sensor.sigen_plant_grid_phase_b_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_grid_phase_b_active_power') }}

      - name: "Sigen Plant Grid Export Power Phase B"
        unique_id: sigen_plant_grid_export_power_phase_b
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ 0 - states('sensor.sigen_plant_grid_phase_b_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_grid_phase_b_active_power') }}

      - name: "Sigen Plant Grid Import Power Phase C"
        unique_id: sigen_plant_grid_import_power_phase_c
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ states('sensor.sigen_plant_grid_phase_c_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_grid_phase_c_active_power') }}

      - name: "Sigen Plant Grid Export Power Phase C"
        unique_id: sigen_plant_grid_export_power_phase_c
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {{ [ 0 - states('sensor.sigen_plant_grid_phase_c_active_power') | float(0), 0 ] | max | round(3) }}
        availability: >
          {{ has_value('sensor.sigen_plant_grid_phase_c_active_power') }}

# kW -> kWh (Riemann sum). max_sub_interval keeps it accumulating when the power value doesn't change.
sensor:
  - platform: integration
    source: sensor.sigen_plant_consumed_power_phase_a
    name: "Sigen Plant Consumed Energy Phase A"
    unique_id: sigen_plant_consumed_energy_phase_a
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_consumed_power_phase_b
    name: "Sigen Plant Consumed Energy Phase B"
    unique_id: sigen_plant_consumed_energy_phase_b
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_consumed_power_phase_c
    name: "Sigen Plant Consumed Energy Phase C"
    unique_id: sigen_plant_consumed_energy_phase_c
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_grid_import_power_phase_a
    name: "Sigen Plant Grid Import Energy Phase A"
    unique_id: sigen_plant_grid_import_energy_phase_a
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_grid_export_power_phase_a
    name: "Sigen Plant Grid Export Energy Phase A"
    unique_id: sigen_plant_grid_export_energy_phase_a
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_grid_import_power_phase_b
    name: "Sigen Plant Grid Import Energy Phase B"
    unique_id: sigen_plant_grid_import_energy_phase_b
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_grid_export_power_phase_b
    name: "Sigen Plant Grid Export Energy Phase B"
    unique_id: sigen_plant_grid_export_energy_phase_b
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_grid_import_power_phase_c
    name: "Sigen Plant Grid Import Energy Phase C"
    unique_id: sigen_plant_grid_import_energy_phase_c
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    source: sensor.sigen_plant_grid_export_power_phase_c
    name: "Sigen Plant Grid Export Energy Phase C"
    unique_id: sigen_plant_grid_export_energy_phase_c
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

utility_meter:
  sigen_plant_consumed_energy_phase_a_daily:
    name: "Sigen Plant Consumed Energy Phase A Daily"
    unique_id: sigen_plant_consumed_energy_phase_a_daily
    source: sensor.sigen_plant_consumed_energy_phase_a
    cycle: daily
  sigen_plant_consumed_energy_phase_b_daily:
    name: "Sigen Plant Consumed Energy Phase B Daily"
    unique_id: sigen_plant_consumed_energy_phase_b_daily
    source: sensor.sigen_plant_consumed_energy_phase_b
    cycle: daily
  sigen_plant_consumed_energy_phase_c_daily:
    name: "Sigen Plant Consumed Energy Phase C Daily"
    unique_id: sigen_plant_consumed_energy_phase_c_daily
    source: sensor.sigen_plant_consumed_energy_phase_c
    cycle: daily
